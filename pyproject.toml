[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prospective"
version = "0.1.0"
description = "Preoperative Planning Platform for Cerebral Aneurysm Clipping"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["prospective*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (run with -m slow or --run-slow)",
    "real_data: marks tests that require the DICOM resource files to be present",
]

[tool.coverage.run]
source = ["prospective"]
omit = ["tests/*"]
